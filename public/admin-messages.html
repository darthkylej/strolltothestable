<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages — Stroll to the Stable Admin</title>
<link rel="stylesheet" href="/style.css">
<style>
  .messages-page {
    max-width:none;
    width:calc(100vw - 40px);
    height:calc(100vh - 76px);
    margin:0 auto;
    padding:14px 10px 0;
    display:grid;
    grid-template-rows:auto auto minmax(0,1fr);
    gap:7px;
  }
  .messages-header { display:flex; justify-content:space-between; gap:18px; align-items:center; margin:0; padding:0 4px 2px; }
  .messages-header h1 { margin:0; font-size:1.55rem; line-height:1.12; }
  .messages-header .eyebrow { margin:0 0 4px; }
  .messages-header p:not(.eyebrow) { margin:4px 0 0; color:var(--wood); font-size:12px; line-height:1.35; }
  .messages-header .btn {
    width:auto;
    margin:0;
    padding:8px 13px;
    min-height:36px;
    font-size:12px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
  }

  .summary-row {
    display:flex;
    align-items:center;
    gap:12px;
    margin:0;
    padding:4px 8px;
    border:1px solid var(--border);
    border-radius:7px;
    background:rgba(8,16,31,.52);
    font-size:11px;
    line-height:1.2;
  }
  .summary-item { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .summary-count { color:var(--gold-bright); font-weight:800; }
  .summary-label { color:var(--muted); }

  .message-layout {
    display:grid;
    grid-template-columns:minmax(330px,34%) minmax(0,66%);
    gap:7px;
    min-height:0;
    height:100%;
    align-items:stretch;
  }

  .thread-list {
    border:1px solid var(--border);
    border-radius:9px;
    overflow-y:auto;
    background:rgba(7,14,27,.58);
    min-height:0;
  }
  .thread-row {
    display:block;
    width:100%;
    border:0;
    border-bottom:1px solid rgba(255,255,255,.08);
    padding:5px 7px;
    text-align:left;
    color:var(--text);
    cursor:pointer;
    font:inherit;
    min-height:0;
  }
  .thread-row:last-child { border-bottom:0; }
  .thread-row.pending { background:rgba(126,36,36,.52); }
  .thread-row.done { background:rgba(31,101,57,.46); }
  .thread-row.pending:hover { background:rgba(150,43,43,.62); }
  .thread-row.done:hover { background:rgba(38,121,68,.56); }
  .thread-row.active {
    box-shadow:inset 0 0 0 2px var(--gold);
    filter:brightness(1.08);
  }
  .thread-email {
    display:block;
    color:#fff3cf;
    font-weight:800;
    font-size:12px;
    line-height:1.18;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .thread-preview {
    display:block;
    margin-top:2px;
    color:rgba(255,255,255,.82);
    font-size:11px;
    line-height:1.2;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .conversation {
    min-height:0;
    height:100%;
    border:1px solid var(--border);
    border-radius:9px;
    background:rgba(8,16,31,.70);
    overflow:hidden;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
  }
  .conversation-empty {
    min-height:0;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    text-align:center;
    padding:18px;
  }
  .conversation-head { padding:8px 10px; border-bottom:1px solid var(--border); background:rgba(4,10,22,.45); }
  .conversation-head h2 { margin:0 0 2px; color:var(--gold-bright); font-size:1rem; }
  .conversation-head p { margin:0; color:var(--muted); font-size:11px; overflow-wrap:anywhere; }
  .conversation-actions { display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin-top:5px; }
  .conversation-actions .btn { width:auto; margin:0; padding:4px 7px; font-size:10px; }

  .messages { padding:8px; display:grid; align-content:start; gap:6px; min-height:0; overflow:auto; }
  .bubble { max-width:92%; padding:5px 7px; border-radius:8px; line-height:1.25; font-size:12px; overflow-wrap:anywhere; align-self:start; }
  .bubble-text { white-space:pre-wrap; margin:0; }
  .bubble.inbound { justify-self:start; background:rgba(255,255,255,.07); border:1px solid var(--border); }
  .bubble.outbound { justify-self:end; background:rgba(61,92,142,.28); border:1px solid rgba(119,154,210,.28); }
  .bubble-meta { margin-top:2px; color:var(--muted); font-size:9px; line-height:1.15; }

  .reply-box { padding:7px 9px 8px; border-top:1px solid var(--border); background:rgba(4,10,22,.68); }
  .reply-box textarea { margin:0 0 5px; min-height:62px; max-height:110px; resize:vertical; padding:7px 8px; font-size:13px; }
  .reply-actions { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .reply-actions .btn { width:auto; margin:0; padding:7px 11px; font-size:12px; }
  .reply-from { color:var(--muted); font-size:10px; }

  .message-success {
    display:none;
    position:fixed;
    top:84px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    margin:0;
    padding:7px 10px;
    border-radius:8px;
    color:#d7f7df;
    background:rgba(34,115,65,.96);
    border:1px solid rgba(115,214,142,.34);
    font-size:12px;
    box-shadow:0 8px 22px rgba(0,0,0,.28);
  }
  .delete-conversation { margin-left:auto; border:0; background:transparent; color:rgba(255,158,139,.55); padding:3px 1px; font:inherit; font-size:10px; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .delete-conversation:hover { color:var(--barn-red); }

  @media (max-width:850px) {
    .messages-page { width:calc(100vw - 18px); height:auto; min-height:calc(100vh - 70px); padding:12px 6px 0; grid-template-rows:auto auto auto; }
    .messages-header { align-items:flex-start; padding:0 2px 2px; }
    .messages-header p:not(.eyebrow) { display:none; }
    .summary-row { flex-wrap:wrap; }
    .message-layout { grid-template-columns:1fr; height:auto; }
    .thread-list { max-height:36vh; }
    .conversation { height:auto; min-height:52vh; }
    .messages { max-height:38vh; }
  }
</style>
</head>
<body>
<div class="page wide messages-page">
  <div class="messages-header">
    <div>
      <p class="eyebrow">Stroll to the Stable · Admin</p>
      <h1>Messages</h1>
      <p>See incoming questions, reply as Stroll to the Stable, and keep the whole conversation together.</p>
    </div>
    <a class="btn btn-outline" href="/admin-dashboard.html">← Admin Home</a>
  </div>

  <div class="error-banner" data-error-banner></div>
  <div class="message-success" id="successBanner"></div>

  <div class="summary-row" aria-label="Message totals">
    <span class="summary-item"><span class="summary-count" id="countPending">—</span><span class="summary-label">need reply</span></span>
    <span class="summary-item"><span class="summary-count" id="countAnswered">—</span><span class="summary-label">answered</span></span>
    <span class="summary-item"><span class="summary-count" id="countAll">—</span><span class="summary-label">total</span></span>
  </div>

  <div class="message-layout">
    <div class="thread-list" id="threadList">
      <div class="empty-state">Loading messages…</div>
    </div>
    <section class="conversation" id="conversation">
      <div class="conversation-empty">Select a message to see the conversation.</div>
    </section>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let currentFilter = 'all';
let currentThreadId = new URLSearchParams(window.location.search).get('id') || '';
let threadMap = new Map();

async function messageApi(path, options = {}) {
  const response = await fetch(path, {
    method: options.method || 'GET',
    headers: options.body ? { 'Content-Type':'application/json' } : undefined,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if (response.status === 401) {
    const next = window.location.pathname + window.location.search;
    window.location.href = '/admin-login.html?next=' + encodeURIComponent(next);
    throw new Error('Admin login required');
  }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

function esc(value) {
  return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
}

function formatWhen(value) {
  if (!value) return '';
  const d = new Date(value);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay
    ? d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })
    : d.toLocaleDateString([], { month:'short', day:'numeric', year:d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}

function shortAddress(address) {
  return String(address || '').split('@')[0];
}

function showSuccess(message) {
  const el = document.getElementById('successBanner');
  el.textContent = message;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function setCounts(counts) {
  document.getElementById('countPending').textContent = counts.pending;
  document.getElementById('countAnswered').textContent = counts.answered;
  document.getElementById('countAll').textContent = counts.total;
}

function renderThreadList(threads) {
  threadMap = new Map(threads.map(t => [String(t.id), t]));
  const list = document.getElementById('threadList');
  if (!threads.length) {
    list.innerHTML = '<div class="empty-state">No conversations yet.</div>';
    return;
  }

  list.innerHTML = threads.map(t => {
    const preview = String(t.preview || '').replace(/\s+/g, ' ').trim();
    const snippet = preview.length > 105 ? preview.slice(0, 105) + '…' : preview;
    const stateClass = t.status === 'pending' ? 'pending' : 'done';
    return `
      <button class="thread-row ${stateClass} ${String(t.id) === String(currentThreadId) ? 'active' : ''}" data-thread-id="${t.id}">
        <span class="thread-email">${esc(t.contact_email)}</span>
        <span class="thread-preview">${esc(snippet || 'No message text')}</span>
      </button>`;
  }).join('');
}

async function loadThreads({ keepSelection = true } = {}) {
  hideError();
  const qs = new URLSearchParams({ status: currentFilter });

  try {
    const data = await messageApi('/api/admin/messages?' + qs.toString());
    setCounts(data.counts);
    renderThreadList(data.threads);

    if (keepSelection && currentThreadId) {
      await loadThread(currentThreadId);
    } else if (!currentThreadId && data.threads.length) {
      currentThreadId = String(data.threads[0].id);
      updateUrl();
      renderThreadList(data.threads);
      await loadThread(currentThreadId);
    } else if (!data.threads.length) {
      document.getElementById('conversation').innerHTML = '<div class="conversation-empty">Nothing to show here right now.</div>';
    }
  } catch (err) {
    if (err.message !== 'Admin login required') showError(err.message);
  }
}

async function loadThread(id) {
  try {
    const { thread, messages } = await messageApi('/api/admin/messages/' + id);
    currentThreadId = String(thread.id);
    updateUrl();
    document.querySelectorAll('.thread-row').forEach(row => row.classList.toggle('active', row.dataset.threadId === currentThreadId));

    const conversation = document.getElementById('conversation');
    conversation.innerHTML = `
      <div class="conversation-head">
        <h2>${esc(thread.subject || 'No subject')}</h2>
        <p><b>${esc(thread.contact_email)}</b> → ${esc(thread.source_address)} · ${esc(thread.thread_code)}</p>
        <div class="conversation-actions">
          ${thread.status === 'pending'
            ? '<button class="btn btn-outline" data-status-action="answered">No Reply Needed</button>'
            : '<button class="btn btn-outline" data-status-action="pending">Mark Needs Reply</button>'}
          <button class="delete-conversation" id="deleteConversationBtn" type="button">Delete conversation</button>
        </div>
      </div>
      <div class="messages" id="messageThread">
        ${messages.map(m => `
          <div class="bubble ${m.direction}"><div class="bubble-text">${esc(m.body_text)}</div><div class="bubble-meta">${m.direction === 'inbound'
              ? esc(m.sender_email)
              : 'Sent by ' + esc(m.admin_email || 'admin')} · ${esc(new Date(m.created_at).toLocaleString())}</div></div>`).join('')}
      </div>
      <div class="reply-box">
        <textarea id="replyText" placeholder="Type your reply…"></textarea>
        <div class="reply-actions">
          <span class="reply-from">Reply will be sent from <b>${esc(thread.source_address)}</b></span>
          <button class="btn btn-primary" id="sendReplyBtn">Send Reply</button>
        </div>
      </div>`;

    const messageThread = document.getElementById('messageThread');
    messageThread.scrollTop = messageThread.scrollHeight;

    document.getElementById('sendReplyBtn').addEventListener('click', sendReply);
    document.getElementById('deleteConversationBtn').addEventListener('click', deleteConversation);
    conversation.querySelectorAll('[data-status-action]').forEach(btn => btn.addEventListener('click', () => setStatus(btn.dataset.statusAction)));
  } catch (err) {
    if (err.message !== 'Admin login required') showError(err.message);
  }
}

async function deleteConversation() {
  const thread = threadMap.get(String(currentThreadId));
  const label = thread?.subject || 'this conversation';
  if (!window.confirm(`Delete “${label}”?\n\nThis permanently removes the conversation and its message history.`)) return;

  hideError();
  const btn = document.getElementById('deleteConversationBtn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Deleting…';
  }

  try {
    await messageApi('/api/admin/messages/' + currentThreadId, { method:'DELETE' });
    currentThreadId = '';
    updateUrl();
    document.getElementById('conversation').innerHTML = '<div class="conversation-empty">Select a message to see the conversation.</div>';
    showSuccess('Conversation deleted.');
    await loadThreads({ keepSelection:false });
  } catch (err) {
    if (err.message !== 'Admin login required') showError(err.message);
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Delete conversation';
    }
  }
}

async function sendReply() {
  hideError();
  const text = document.getElementById('replyText').value.trim();
  if (!text) { showError('Type a reply first.'); return; }

  const btn = document.getElementById('sendReplyBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    await messageApi('/api/admin/messages/' + currentThreadId + '/reply', { method:'POST', body:{ message:text } });
    showSuccess('Reply sent from Stroll to the Stable.');
    await loadThreads({ keepSelection:true });
  } catch (err) {
    if (err.message !== 'Admin login required') showError(err.message);
    btn.disabled = false;
    btn.textContent = 'Send Reply';
  }
}

async function setStatus(status) {
  hideError();
  try {
    await messageApi('/api/admin/messages/' + currentThreadId + '/status', { method:'POST', body:{ status } });
    showSuccess(status === 'answered' ? 'Marked as not needing a reply.' : 'Marked as needing a reply.');
    await loadThreads({ keepSelection:true });
  } catch (err) {
    if (err.message !== 'Admin login required') showError(err.message);
  }
}

function updateUrl() {
  const url = new URL(window.location.href);
  if (currentThreadId) url.searchParams.set('id', currentThreadId);
  else url.searchParams.delete('id');
  history.replaceState(null, '', url);
}

document.getElementById('threadList').addEventListener('click', e => {
  const row = e.target.closest('[data-thread-id]');
  if (!row) return;
  loadThread(row.dataset.threadId);
});

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

loadThreads();
</script>
</body>
</html>

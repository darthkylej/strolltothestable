<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Media — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
<style>
  .media-admin { max-width: 980px; }
  .media-header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:24px; }
  .media-header p { color:var(--wood); margin:6px 0 0; }
  .media-header .btn { width:auto; margin:0; }
  .upload-card { padding:20px; border:1px solid var(--border); border-radius:18px; background:rgba(8,16,31,.64); margin-bottom:24px; }
  .upload-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .upload-grid .full { grid-column:1 / -1; }
  .upload-note { color:var(--muted); font-size:.9rem; line-height:1.5; margin:8px 0 0; }
  .media-list { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; }
  .media-item { border:1px solid var(--border); border-radius:18px; background:rgba(10,19,35,.8); overflow:hidden; }
  .media-preview { width:100%; aspect-ratio:16/9; display:block; object-fit:contain; background:#02050d; }
  .media-info { padding:15px; }
  .media-title { color:var(--gold-bright); font-weight:700; margin:0 0 6px; }
  .media-caption { color:var(--wood); white-space:pre-wrap; margin:0 0 10px; line-height:1.45; }
  .media-meta { color:var(--muted); font-size:.82rem; margin-bottom:12px; }
  .media-actions { display:flex; justify-content:flex-end; }
  .media-actions .btn { width:auto; margin:0; padding:9px 13px; }
  .upload-queue { list-style:none; padding:0; margin:14px 0 0; display:grid; gap:8px; }
  .upload-queue:empty { display:none; }
  .queue-item { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:12px; background:rgba(10,19,35,.8); }
  .queue-name { color:var(--wood); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .queue-state { color:var(--muted); font-size:.85rem; white-space:nowrap; }
  .queue-item.done .queue-state { color:#9fe3b0; }
  .queue-item.failed .queue-state { color:#ffb4a8; white-space:normal; text-align:right; }
  .queue-bar { grid-column:1 / -1; height:4px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; }
  .queue-bar span { display:block; height:100%; width:0; background:var(--gold-bright); transition:width .2s; }
  .queue-item.failed .queue-bar span { background:#d9604c; }
  .success-banner { display:none; margin-bottom:16px; padding:12px 14px; border-radius:12px; color:#d7f7df; background:rgba(34,115,65,.23); border:1px solid rgba(115,214,142,.28); }
  @media (max-width:720px) {
    .media-header { display:block; }
    .media-header .btn { margin-top:14px; }
    .upload-grid { grid-template-columns:1fr; }
    .upload-grid .full { grid-column:auto; }
    .media-list { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="page wide media-admin">
  <div class="media-header">
    <div>
      <p class="eyebrow">Stroll to the Stable · Admin</p>
      <h1>Tour Media</h1>
    </div>
    <a class="btn btn-outline" href="/admin-dashboard.html">Back to Admin</a>
  </div>

  <div class="error-banner" data-error-banner></div>
  <div class="success-banner" id="successBanner"></div>

  <section class="upload-card">
    <h2 style="margin-top:0">Add to the collection</h2>
    <div class="upload-grid">
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" maxlength="120" placeholder="Optional title">
      </div>
      <div class="field">
        <label for="file">Images or videos</label>
        <input id="file" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" required>
        <p class="upload-note">You can pick as many as you like at once. The title and caption, if filled in, go on every file in the batch.</p>
      </div>
      <div class="field full">
        <label for="caption">Caption</label>
        <textarea id="caption" maxlength="600" rows="4" placeholder="Optional description, artist information, scripture, or context"></textarea>
      </div>
    </div>
    <button class="btn btn-primary" id="uploadBtn" type="button">Upload to Scroll to the Stable</button>
    <ul class="upload-queue" id="uploadQueue"></ul>
  </section>

  <h2>Standalone collection items</h2>
  <div id="mediaList" class="media-list"></div>
</div>

<script src="/js/app.js"></script>
<script>
let knownMedia = new Map();

function esc(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function showSuccess(message) {
  const el = document.getElementById('successBanner');
  el.textContent = message;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3500);
}

function formatSize(bytes) {
  const mb = Number(bytes || 0) / 1024 / 1024;
  return mb >= 1 ? `${mb.toFixed(1)} MB` : `${Math.max(1, Math.round(Number(bytes || 0) / 1024))} KB`;
}

async function loadMedia() {
  hideError();
  try {
    const { media } = await api('/api/admin/tour-media');
    knownMedia = new Map(media.map((item) => [item.key, item]));
    const list = document.getElementById('mediaList');
    if (!media.length) {
      list.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No standalone artwork or videos have been added yet.</div>';
      return;
    }

    list.innerHTML = media.map((item) => {
      const preview = item.mediaType === 'video'
        ? `<video class="media-preview" src="${esc(item.url)}" controls playsinline preload="metadata"></video>`
        : `<img class="media-preview" src="${esc(item.url)}" alt="${esc(item.title || 'Tour artwork')}">`;
      return `
        <article class="media-item">
          ${preview}
          <div class="media-info">
            ${item.title ? `<p class="media-title">${esc(item.title)}</p>` : ''}
            ${item.caption ? `<p class="media-caption">${esc(item.caption)}</p>` : ''}
            <div class="media-meta">${item.mediaType === 'video' ? 'Video' : 'Artwork / image'} · ${formatSize(item.size)}</div>
            <div class="media-actions">
              <button class="btn btn-danger" data-delete-key="${esc(item.key)}">Delete</button>
            </div>
          </div>
        </article>`;
    }).join('');
  } catch (err) {
    showError(err.message);
  }
}

const MAX_UPLOAD_BYTES = 95 * 1024 * 1024;
const UPLOAD_LABEL = 'Upload to Scroll to the Stable';

function sendFile(file, title, caption, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/admin/tour-media');
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.setRequestHeader('X-Media-Title', encodeURIComponent(title));
    xhr.setRequestHeader('X-Media-Caption', encodeURIComponent(caption));
    xhr.upload.onprogress = (event) => {
      if (event.lengthComputable) onProgress(event.loaded / event.total);
    };
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText || '{}'); } catch (_) { /* not JSON */ }
      if (xhr.status >= 200 && xhr.status < 300) resolve(data);
      else reject(new Error(data.error || `Upload failed (${xhr.status}).`));
    };
    xhr.onerror = () => reject(new Error('Network error. Check the connection and try again.'));
    xhr.send(file);
  });
}

function setRow(row, state, text, fraction) {
  row.className = `queue-item ${state}`;
  row.querySelector('.queue-state').textContent = text;
  if (fraction != null) row.querySelector('.queue-bar span').style.width = `${Math.round(fraction * 100)}%`;
}

async function upload() {
  hideError();
  const input = document.getElementById('file');
  const files = Array.from(input.files || []);
  if (!files.length) {
    showError('Choose at least one image or video first.');
    return;
  }

  const title = document.getElementById('title').value.trim();
  const caption = document.getElementById('caption').value.trim();
  const queue = document.getElementById('uploadQueue');
  queue.innerHTML = files.map((file) => `
    <li class="queue-item">
      <span class="queue-name">${esc(file.name || 'Unnamed file')}</span>
      <span class="queue-state">Waiting</span>
      <div class="queue-bar"><span></span></div>
    </li>`).join('');
  const rows = Array.from(queue.children);

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  input.disabled = true;

  let ok = 0;
  for (let i = 0; i < files.length; i += 1) {
    const file = files[i];
    const row = rows[i];
    btn.textContent = `Uploading ${i + 1} of ${files.length}…`;
    if (file.size > MAX_UPLOAD_BYTES) {
      setRow(row, 'failed', 'Too large (95 MB max)', 1);
      continue;
    }
    setRow(row, 'active', '0%', 0);
    try {
      await sendFile(file, title, caption, (fraction) => setRow(row, 'active', `${Math.round(fraction * 100)}%`, fraction));
      setRow(row, 'done', 'Uploaded', 1);
      ok += 1;
    } catch (err) {
      setRow(row, 'failed', err.message, 1);
    }
  }

  const failed = files.length - ok;
  input.disabled = false;
  btn.disabled = false;
  btn.textContent = UPLOAD_LABEL;
  if (ok) {
    input.value = '';
    if (!failed) {
      document.getElementById('title').value = '';
      document.getElementById('caption').value = '';
      showSuccess(ok === 1 ? 'Added to Scroll to the Stable.' : `Added ${ok} files to Scroll to the Stable.`);
    }
    await loadMedia();
  }
  if (failed) {
    showError(`${failed} of ${files.length} ${files.length === 1 ? 'file' : 'files'} did not upload. See the list under the button.`);
  }
}

document.getElementById('uploadBtn').addEventListener('click', upload);

document.getElementById('mediaList').addEventListener('click', async (event) => {
  const btn = event.target.closest('[data-delete-key]');
  if (!btn) return;
  const key = btn.dataset.deleteKey;
  const item = knownMedia.get(key);
  if (!item) return;
  const label = item.title || (item.mediaType === 'video' ? 'this video' : 'this artwork');
  if (!window.confirm(`Permanently remove ${label} from Scroll to the Stable?`)) return;

  btn.disabled = true;
  btn.textContent = 'Deleting…';
  try {
    await api('/api/admin/tour-media', { method: 'DELETE', body: { key } });
    showSuccess('The collection item was removed.');
    await loadMedia();
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = 'Delete';
  }
});

loadMedia();
</script>
</body>
</html>

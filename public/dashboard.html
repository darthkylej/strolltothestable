<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Nativities — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
<style>
  .process-guide { display:grid; gap:10px; margin-top:12px; }
  .process-step { display:grid; grid-template-columns:34px 1fr; gap:10px; padding:12px; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,.025); }
  .process-num { width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--gold); color:#10172a; font-weight:800; }
  .process-step h3 { margin:1px 0 5px; font-size:1rem; color:var(--gold-bright); }
  .process-step p { margin:0; color:var(--wood); line-height:1.45; }
  .process-day { margin-top:4px; color:var(--wood); line-height:1.45; }
  .process-location { margin-top:5px; color:var(--muted); font-size:13px; }
  .nat-head { display:flex; gap:12px; align-items:flex-start; }
  .nat-thumb { width:76px; height:76px; flex-shrink:0; object-fit:cover; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,.04); }
  .nat-title { flex:1; min-width:0; }
  .nat-desc { color:var(--wood); font-size:14px; margin:10px 0 0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .nat-card { cursor:pointer; transition:border-color .15s ease, transform .15s ease; }
  .nat-card:hover { border-color:var(--border-strong); transform:translateY(-1px); }
  .nat-more { margin-top:12px; color:var(--gold-bright); font-weight:700; font-size:14px; }
  .next-step { margin:12px 0; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,.03); line-height:1.5; }
  .next-step.ready { border-color:rgba(123,203,140,.35); background:rgba(123,203,140,.08); }
  .next-step strong { color:var(--gold-bright); }
  .next-step .process-day { margin-top:2px; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">Stroll to the Stable</p>
  <h1>My Nativities</h1>
  <p id="donorCodeLine" style="display:none;margin:-6px 0 14px;color:var(--wood)">Your donor code: <strong id="donorCodeValue" style="color:var(--gold-bright);font-size:1.15em"></strong> <span style="font-size:.9em">(give this at drop-off and pick-up)</span></p>

  <div class="error-banner" data-error-banner></div>

  <details class="card" id="scheduleCard" style="display:none; margin-bottom:18px">
    <summary style="cursor:pointer;font-weight:700">Schedule and How It Works</summary>
    <div class="process-guide" id="scheduleInfo"></div>
  </details>

  <a class="btn btn-primary" id="newSubmissionAction" href="/lend-photo.html" style="display:none">Lend a Nativity</a>

  <div id="list" style="margin-top:24px"></div>

  <p style="text-align:center; margin-top:20px"><a class="link" href="/account.html">My Account (password and contact info)</a> · <a class="link" href="#" id="logoutLink">Log Out</a></p>
</div>
<script src="/js/app.js"></script>
<script>
const CURRENT_YEAR = new Date().getFullYear();
let submissionsOpen = false;
let siteSettings = {};
const ADDRESS = '101 E Nolte St, Seguin, TX 78155';

function formatDateTime(value) {
  if (!value) return '';
  return new Date(value).toLocaleString([], { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
}

function dateFromKey(key) {
  const [y,m,d] = String(key).split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatTime(value) {
  if (!value) return '';
  const [h,m] = value.split(':').map(Number);
  return new Date(2000,0,1,h,m).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}

function dailyScheduleHtml(days) {
  const available = (Array.isArray(days) ? days : []).filter((d) => d.available !== false);
  if (!available.length) return '<p>Dates and times will be announced soon.</p>';
  return available.map((d) => {
    const date = dateFromKey(d.date).toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
    return `<div class="process-day"><strong>${date}:</strong> ${formatTime(d.start)} – ${formatTime(d.end)}</div>`;
  }).join('');
}

function stepHtml(number, title, body, location = false) {
  return `<div class="process-step">
    <div class="process-num">${number}</div>
    <div>
      <h3>${title}</h3>
      ${body}
      ${location ? '<div class="process-location">101 E Nolte St, Seguin, TX 78155</div>' : ''}
    </div>
  </div>`;
}

function renderSchedule(settings) {
  const registration = settings.submissionEnd
    ? `<p>Complete your online preregistration by <strong>${formatDateTime(settings.submissionEnd)}</strong>.</p>`
    : '<p>The preregistration deadline will be announced soon.</p>';

  document.getElementById('scheduleInfo').innerHTML =
    stepHtml(1, 'Online Preregistration', registration) +
    stepHtml(2, 'Drop Off Your Nativity', dailyScheduleHtml(settings.dropoffDays), true) +
    stepHtml(3, 'Pick Up Your Nativity', dailyScheduleHtml(settings.pickupDays), true);
  document.getElementById('scheduleCard').style.display = 'block';
}

async function load() {
  try {
    const [submissionData, settings] = await Promise.all([
      api('/api/nativities'),
      api('/api/settings'),
    ]);
    const { nativities } = submissionData;
    if (submissionData.donorCode) {
      document.getElementById('donorCodeValue').textContent = submissionData.donorCode;
      document.getElementById('donorCodeLine').style.display = 'block';
    }
    submissionsOpen = settings.submissionsOpen;
    siteSettings = settings;
    renderSchedule(settings);
    document.getElementById('newSubmissionAction').style.display = submissionsOpen ? 'flex' : 'none';

    const list = document.getElementById('list');
    if (nativities.length === 0) {
      list.innerHTML = '<div class="empty-state">You haven\'t submitted a nativity yet.</div>';
      return;
    }
    list.innerHTML = nativities.map(cardHtml).join('');
  } catch (err) {
    showError(err.message);
  }
}

// One clear status and next step per submission.
function cardState(n) {
  const draft = n.submission_number.startsWith('DRAFT');
  const number = esc(n.submission_number);
  if (draft) return {
    pill: 'Not finished', cls: 'action',
    body: `<div class="next-step"><strong>Next:</strong> finish listing your pieces, then sign the waiver.</div>`,
    button: `<a class="btn btn-primary" href="/lend-pieces.html?id=${n.id}&review=1">Continue Registration</a>`,
  };
  if (n.status === 'pending' && !n.waiver_signed && n.waiver_method === 'paper') return {
    pill: 'Ready for drop-off', cls: 'ready',
    body: `<div class="next-step">You'll sign the waiver on paper at drop-off.</div>`,
    button: '',
  };
  if (n.status === 'pending' && !n.waiver_signed) return {
    pill: 'Waiver needed', cls: 'action',
    body: `<div class="next-step"><strong>Next:</strong> sign the waiver to finish your registration.</div>`,
    button: `<a class="btn btn-primary" href="/waiver.html?id=${n.id}">Sign Waiver</a>`,
  };
  const waiverLink = '';
  if (n.status === 'pending') return {
    pill: 'Ready for drop-off', cls: 'ready',
    body: '',
    button: waiverLink,
  };
  if (n.status === 'submitted') return {
    pill: 'Checked in', cls: 'submitted',
    body: '',
    button: waiverLink,
  };
  return { pill: 'Returned', cls: 'returned', body: '', button: waiverLink };
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' })[c]);
}

function cardHtml(n) {
  const st = cardState(n);
  const draft = n.submission_number.startsWith('DRAFT');
  return `
      <div class="card nat-card" style="padding:14px 18px;margin-bottom:10px" data-href="/my-nativity.html?id=${n.id}" role="link" tabindex="0" aria-label="Open ${draft ? 'unfinished submission' : esc(n.submission_number)}">
        <div class="nat-head">
          ${n.photo_key ? `<img class="nat-thumb" src="/photos/${esc(n.photo_key)}" alt="Your nativity" loading="lazy">` : ''}
          <div class="nat-title">
            <span class="status-pill status-${st.cls}">${st.pill}</span>
            <h2 style="margin:6px 0 0">${draft ? 'Not finished' : esc(n.submission_number)}</h2>
            <div class="eyebrow" style="margin-top:2px">${n.event_year}${draft ? '' : ` · ${n.piece_count} piece${n.piece_count === 1 ? '' : 's'}`}</div>
          </div>
        </div>
        ${n.description ? `<p class="nat-desc">${esc(n.description)}</p>` : ''}
        ${st.body}
        ${st.button}
        <div class="nat-more">View details, waiver and edits ›</div>
        ${submissionsOpen && n.status === 'returned' && Number(n.event_year) < CURRENT_YEAR
          ? `<button class="btn btn-secondary" onclick="resubmit(${n.id})">Submit Again This Year</button>`
          : ''}
      </div>`;
}

// Tapping a card opens its page, except when tapping a button or link on it.
document.addEventListener('click', (e) => {
  const card = e.target.closest('.nat-card');
  if (!card || e.target.closest('a, button, input, label')) return;
  window.location.href = card.dataset.href;
});
document.addEventListener('keydown', (e) => {
  const card = e.target.closest && e.target.closest('.nat-card');
  if (card && e.target === card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); window.location.href = card.dataset.href; }
});

async function resubmit(id) {
  hideError();
  try {
    const { id: newId } = await api(`/api/nativities/${id}/resubmit`, { method: 'POST' });
    window.location.href = `/lend-pieces.html?id=${newId}&review=1`;
  } catch (err) {
    showError(err.message);
  }
}


document.getElementById('logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  await api('/api/logout', { method: 'POST' });
  window.location.href = '/index.html';
});

load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Nativities — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <p class="eyebrow">Stroll to the Stable</p>
  <h1>My Nativities</h1>

  <div class="error-banner" data-error-banner></div>

  <div class="card" id="scheduleCard" style="display:none; margin-bottom:18px">
    <h2 style="margin-top:0">Important Dates</h2>
    <div id="scheduleInfo" style="color:var(--wood); line-height:1.6"></div>
  </div>

  <a class="btn btn-primary" id="newSubmissionAction" href="/lend-photo.html" style="display:none">Lend a Nativity</a>

  <div id="list" style="margin-top:24px"></div>

  <p style="text-align:center; margin-top:20px"><a class="link" href="#" id="logoutLink">Log Out</a></p>
</div>
<script src="/js/app.js"></script>
<script>
const CURRENT_YEAR = new Date().getFullYear();
let submissionsOpen = false;

function formatRange(start, end) {
  if (!start || !end) return '';
  const opts = { month:'long', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' };
  return `${new Date(start).toLocaleString([], opts)} – ${new Date(end).toLocaleString([], opts)}`;
}

function renderSchedule(settings) {
  const rows = [];
  if (settings.submissionStart && settings.submissionEnd) rows.push(`<div><strong>Submit your nativity:</strong> ${formatRange(settings.submissionStart, settings.submissionEnd)}</div>`);
  if (settings.dropoffStart && settings.dropoffEnd) rows.push(`<div><strong>Drop-off:</strong> ${formatRange(settings.dropoffStart, settings.dropoffEnd)}</div>`);
  if (settings.pickupStart && settings.pickupEnd) rows.push(`<div><strong>Pickup:</strong> ${formatRange(settings.pickupStart, settings.pickupEnd)}</div>`);
  if (rows.length) {
    document.getElementById('scheduleInfo').innerHTML = rows.join('');
    document.getElementById('scheduleCard').style.display = 'block';
  }
}

async function load() {
  try {
    const [submissionData, settings] = await Promise.all([
      api('/api/nativities'),
      api('/api/settings'),
    ]);
    const { nativities } = submissionData;
    submissionsOpen = settings.submissionsOpen;
    renderSchedule(settings);
    document.getElementById('newSubmissionAction').style.display = submissionsOpen ? 'flex' : 'none';

    const list = document.getElementById('list');
    if (nativities.length === 0) {
      list.innerHTML = '<div class="empty-state">You haven\'t submitted a nativity yet.</div>';
      return;
    }
    list.innerHTML = nativities.map((n) => `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start">
          <div>
            <div class="eyebrow">${n.event_year}</div>
            <h2>${n.submission_number.startsWith('DRAFT') ? 'Not finished' : n.submission_number}</h2>
          </div>
          <span class="status-pill status-${n.status}">${n.status}</span>
        </div>
        <p style="color:var(--wood)">${n.piece_count} piece${n.piece_count === 1 ? '' : 's'}</p>
        <div style="display:flex; align-items:center; gap:10px; margin:12px 0">
          <label class="switch" style="margin:0">
            <input type="checkbox" ${n.include_in_tour ? 'checked' : ''} onchange="toggleTour(${n.id}, this.checked)">
            <span class="track"></span>
          </label>
          <span style="font-size:14px; color:var(--wood)">Show in public virtual tour</span>
        </div>
        ${submissionsOpen && n.status === 'returned' && Number(n.event_year) < CURRENT_YEAR
          ? `<button class="btn btn-secondary" onclick="resubmit(${n.id})">Submit Again This Year</button>`
          : ''}
      </div>
    `).join('');
  } catch (err) {
    showError(err.message);
  }
}

async function resubmit(id) {
  hideError();
  try {
    const { id: newId } = await api(`/api/nativities/${id}/resubmit`, { method: 'POST' });
    window.location.href = `/lend-pieces.html?id=${newId}&review=1`;
  } catch (err) {
    showError(err.message);
  }
}

async function toggleTour(id, checked) {
  hideError();
  try {
    await api(`/api/nativities/${id}/tour-visibility`, { method: 'POST', body: { includeInTour: checked } });
  } catch (err) {
    showError(err.message);
    load();
  }
}

document.getElementById('logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  await api('/api/logout', { method: 'POST' });
  window.location.href = '/index.html';
});

load();
</script>
</body>
</html>

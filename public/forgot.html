<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Login — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <p class="eyebrow">Stroll to the Stable</p>
  <h1>Forgot Your Login?</h1>
  <p style="color:var(--wood); margin-bottom:20px">Enter the email you registered with and we'll send you a new username and password.</p>

  <div class="error-banner" data-error-banner></div>
  <div id="successMsg" style="display:none; color:var(--pasture); font-weight:600; margin-bottom:16px">
    If that email is registered, a new login is on its way.
  </div>

  <form id="forgotForm">
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" required>
    </div>
    <button type="submit" class="btn btn-primary">Send My Login</button>
  </form>

  <p style="text-align:center; margin-top:10px"><a class="link" href="/login.html">Back to Log In</a></p>
</div>
<script src="/js/app.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  try {
    await api('/api/forgot-login', { method: 'POST', body: { email: document.getElementById('email').value } });
    document.getElementById('forgotForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) {
    showError(err.message);
  }
});
</script>
</body>
</html>

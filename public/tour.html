<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll to the Stable — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
<style>
  body.tour-page {
    background:
      linear-gradient(rgba(3,7,21,.72), rgba(3,7,21,.82)),
      var(--tour-background-image, none),
      radial-gradient(circle at 50% 0%, rgba(95,124,190,.20), transparent 26%),
      linear-gradient(180deg, #07111f 0%, #0d1830 38%, #111426 100%);
    background-size: cover, cover, auto, auto;
    background-position: center center, center center, center top, center top;
    background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
    background-attachment: fixed, fixed, fixed, fixed;
  }
  .tour-card { overflow:hidden; }
  /* Space is reserved before each image loads (fixed 4:3 box, photo fitted
     inside without cropping), so the page never jumps while scrolling. */
  .tour-media { width:100%; height:auto; display:block; border-radius:12px; margin-bottom:14px; background:#02050d; aspect-ratio:4 / 3; object-fit:contain; }
  video.tour-media { aspect-ratio:16 / 9; max-height:70vh; }
  .tour-card { content-visibility:auto; contain-intrinsic-size:auto 520px; }
  .tour-title { color:var(--gold-bright); margin:0 0 8px; font-family:'Fraunces', Georgia, serif; }
  .tour-caption { color:var(--wood); margin:0; line-height:1.55; white-space:pre-wrap; }
  .tour-story { color:var(--wood); font-style:italic; margin:0; }
  /* Admin-only controls (never shown to visitors). */
  .admin-bar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin:0 0 12px; padding:10px 12px; border-radius:12px; background:rgba(19,35,63,.85); border:1px solid var(--border-strong, rgba(255,255,255,.25)); font-size:14px; }
  .admin-bar .num { color:var(--gold-bright); font-weight:700; }
  .admin-bar label { display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--wood); font-weight:600; }
  .admin-bar input { width:20px; height:20px; margin:0; accent-color:#d9b45a; cursor:pointer; }
  .admin-bar .hidden-note { flex-basis:100%; color:#ffd3cc; font-size:13px; display:none; }
  .tour-card.flagged .admin-bar .hidden-note { display:block; }
  .tour-card.flagged .tour-media, .tour-card.flagged .tour-story { opacity:.45; }
</style>
</head>
<body class="tour-page">
<div class="page wide">
  <p class="eyebrow">Virtual Tour</p>
  <h1>Scroll to the Stable</h1>
  <svg class="stable-mark" width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M60 4 L64 14 L75 14 L66 21 L69 32 L60 25 L51 32 L54 21 L45 14 L56 14 Z" stroke="currentColor" stroke-width="1.5"/>
    <path d="M10 36 L30 20 L50 36" stroke="currentColor" stroke-width="1.5"/>
    <path d="M70 36 L90 20 L110 36" stroke="currentColor" stroke-width="1.5"/>
  </svg>
  <p style="color:var(--wood); margin-bottom:24px">Explore nativities, artwork, photographs, and videos shared as part of Stroll to the Stable.</p>

  <div class="error-banner" data-error-banner></div>
  <div id="gallery"></div>
</div>
<script src="/js/app.js"></script>
<script>
async function load() {
  try {
    const [tourData, settings] = await Promise.all([
      api('/api/tour?v=4'),
      api('/api/settings'),
    ]);

    if (settings.landingBackgroundUrl) {
      document.body.style.setProperty('--tour-background-image', `url("${settings.landingBackgroundUrl}")`);
    } else {
      document.body.style.removeProperty('--tour-background-image');
    }

    const { tour } = tourData;
    const gallery = document.getElementById('gallery');
    if (tourData.closed && !tour.length) {
      gallery.innerHTML = `<div class="empty-state">
        <strong style="display:block;font-size:1.15rem;color:var(--gold-bright);margin-bottom:8px">The virtual tour is being prepared</strong>
        We are gathering photos of this year's nativities, artwork, and videos. The Scroll to the Stable virtual tour will open soon. Please check back!
      </div>`;
      return;
    }
    if (tourData.closed) {
      gallery.insertAdjacentHTML('beforebegin', '<div class="empty-state" style="margin-bottom:18px">Admin preview: the virtual tour is turned off, so visitors cannot see it. Turn it on in Admin → Scheduling.</div>');
    }
    if (tour.length === 0) {
      gallery.innerHTML = '<div class="empty-state">The collection will appear here as nativities, artwork, and videos are added.</div>';
      return;
    }

    isAdmin = !!tourData.isAdmin;
    if (isAdmin) {
      const flagged = tour.filter((i) => i.type === 'nativity' && i.needsBetterPhoto).length;
      gallery.insertAdjacentHTML('beforebegin', `<div class="empty-state" style="margin-bottom:18px" id="adminNote">Admin view: untick "On the Scroll" to hide a nativity from visitors and mark it as needing a better photo. Tick it again to put it back. A new display photo also puts it back. <span id="flaggedCount">${flagged}</span> hidden right now.</div>`);
    }
    gallery.innerHTML = tour.map(renderItem).join('');
  } catch (err) {
    showError(err.message);
  }
}

let isAdmin = false;

function adminBar(item) {
  if (!isAdmin) return '';
  return `<div class="admin-bar">
    <span class="num">${escapeHtml(item.submissionNumber || '')}</span>
    <label><input type="checkbox" data-scroll-toggle="${escapeAttr(item.id)}" ${item.needsBetterPhoto ? '' : 'checked'}> On the Scroll</label>
    <span class="hidden-note">Hidden from visitors · needs a better photo</span>
  </div>`;
}

document.getElementById('gallery').addEventListener('change', async (e) => {
  const box = e.target.closest('[data-scroll-toggle]');
  if (!box) return;
  const card = box.closest('.tour-card');
  const needsBetterPhoto = !box.checked;
  box.disabled = true;
  hideError();
  try {
    const res = await api(`/api/admin/nativities/${encodeURIComponent(box.dataset.scrollToggle)}/needs-better-photo`, { method: 'POST', body: { needsBetterPhoto } });
    card.classList.toggle('flagged', !!res.needsBetterPhoto);
    box.checked = !res.needsBetterPhoto;
  } catch (err) {
    box.checked = !needsBetterPhoto;
    showError(err.message);
  } finally {
    box.disabled = false;
    const count = document.getElementById('flaggedCount');
    if (count) count.textContent = document.querySelectorAll('.tour-card.flagged').length;
  }
});


function renderItem(item) {
  if (item.type === 'media') {
    const media = item.mediaType === 'video'
      ? `<video class="tour-media" src="${escapeAttr(item.url)}" controls playsinline preload="metadata"></video>`
      : `<img class="tour-media" src="${escapeAttr(item.url)}" alt="${escapeAttr(item.title || 'Artwork in the Stroll to the Stable collection')}" loading="lazy" decoding="async" width="1200" height="900">`;

    return `
      <div class="card tour-card">
        ${media}
        ${item.title ? `<h2 class="tour-title">${escapeHtml(item.title)}</h2>` : ''}
        ${item.caption ? `<p class="tour-caption">${escapeHtml(item.caption)}</p>` : ''}
      </div>`;
  }

  return `
    <div class="card tour-card${isAdmin && item.needsBetterPhoto ? ' flagged' : ''}">
      ${adminBar(item)}
      ${item.photoKey ? `<img class="tour-media" src="/photos/${escapeAttr(item.photoKey)}" alt="Nativity display" loading="lazy" decoding="async" width="1200" height="900">` : ''}
      ${item.story ? `<p class="tour-story">${escapeHtml(item.story)}</p>` : ''}
    </div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function escapeAttr(str) {
  return escapeHtml(str).replaceAll('`', '&#96;');
}

load();
</script>
</body>
</html>

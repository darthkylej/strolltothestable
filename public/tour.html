<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll to the Stable — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
<style>
  .tour-card { overflow:hidden; }
  .tour-media { width:100%; display:block; border-radius:12px; margin-bottom:14px; background:#02050d; }
  video.tour-media { max-height:70vh; }
  .tour-title { color:var(--gold-bright); margin:0 0 8px; font-family:'Fraunces', Georgia, serif; }
  .tour-caption { color:var(--wood); margin:0; line-height:1.55; white-space:pre-wrap; }
  .tour-story { color:var(--wood); font-style:italic; margin:0; }
</style>
</head>
<body>
<div class="page wide">
  <p class="eyebrow">Virtual Tour</p>
  <h1>Scroll to the Stable</h1>
  <svg class="stable-mark" width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M60 4 L64 14 L75 14 L66 21 L69 32 L60 25 L51 32 L54 21 L45 14 L56 14 Z" stroke="currentColor" stroke-width="1.5"/>
    <path d="M10 36 L30 20 L50 36" stroke="currentColor" stroke-width="1.5"/>
    <path d="M70 36 L90 20 L110 36" stroke="currentColor" stroke-width="1.5"/>
  </svg>
  <p style="color:var(--wood); margin-bottom:24px">Explore nativities, artwork, photographs, and videos shared as part of Stroll to the Stable.</p>

  <div class="error-banner" data-error-banner></div>
  <div id="gallery"></div>
</div>
<script src="/js/app.js"></script>
<script>
async function load() {
  try {
    const { tour } = await api('/api/tour?v=3');
    const gallery = document.getElementById('gallery');
    if (tour.length === 0) {
      gallery.innerHTML = '<div class="empty-state">The collection will appear here as nativities, artwork, and videos are added.</div>';
      return;
    }

    gallery.innerHTML = tour.map(renderItem).join('');
  } catch (err) {
    showError(err.message);
  }
}

function renderItem(item) {
  if (item.type === 'media') {
    const media = item.mediaType === 'video'
      ? `<video class="tour-media" src="${escapeAttr(item.url)}" controls playsinline preload="metadata"></video>`
      : `<img class="tour-media" src="${escapeAttr(item.url)}" alt="${escapeAttr(item.title || 'Artwork in the Stroll to the Stable collection')}">`;

    return `
      <div class="card tour-card">
        ${media}
        ${item.title ? `<h2 class="tour-title">${escapeHtml(item.title)}</h2>` : ''}
        ${item.caption ? `<p class="tour-caption">${escapeHtml(item.caption)}</p>` : ''}
      </div>`;
  }

  return `
    <div class="card tour-card">
      ${item.photoKey ? `<img class="tour-media" src="/photos/${escapeAttr(item.photoKey)}" alt="Nativity display">` : ''}
      ${item.story ? `<p class="tour-story">${escapeHtml(item.story)}</p>` : ''}
    </div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function escapeAttr(str) {
  return escapeHtml(str).replaceAll('`', '&#96;');
}

load();
</script>
</body>
</html>

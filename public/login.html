<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <p class="eyebrow">Stroll to the Stable</p>
  <h1>Log In</h1>
  <p style="color:var(--wood); margin-bottom:20px">Log in with your email address and the password from your registration email.</p>

  <div class="error-banner" data-error-banner></div>

  <form id="loginForm">
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" autocomplete="email" inputmode="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">Log In</button>
  </form>

  <p style="text-align:center; margin-top:10px"><a class="link" href="/forgot.html">Forgot your login?</a></p>
  <p style="text-align:center">New here? <a class="link" href="/register.html">Register</a></p>
  <p style="text-align:center"><a class="link" href="/index.html">Back</a></p>
</div>
<script src="/js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  try {
    await api('/api/login', {
      method: 'POST',
      body: {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      },
    });
    window.location.href = '/dashboard.html';
  } catch (err) {
    showError(err.message);
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nativity Submissions — Stroll to the Stable Admin</title>
<link rel="stylesheet" href="/style.css">
<style>
  .admin-page { max-width:980px; }
  .admin-header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:24px; }
  .admin-header p { margin:6px 0 0; color:var(--wood); }
  .admin-tools { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .admin-tools .btn { width:auto; margin:0; padding:10px 16px; }
  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:0 0 22px; }
  .stat-card { appearance:none; text-align:left; color:var(--text); background:rgba(8,16,31,.62); border:1px solid var(--border); border-radius:16px; padding:16px; cursor:pointer; font:inherit; transition:.15s ease; }
  .stat-card:hover { transform:translateY(-1px); border-color:var(--border-strong); }
  .stat-card.active { border-color:var(--gold); box-shadow:0 0 0 1px rgba(242,199,110,.18); background:rgba(20,28,46,.9); }
  .stat-number { display:block; font-family:'Fraunces',Georgia,serif; color:var(--gold-bright); font-size:1.8rem; line-height:1; }
  .stat-label { display:block; margin-top:7px; color:var(--muted); font-size:.82rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .admin-search { display:flex; gap:10px; align-items:center; padding:14px; background:rgba(7,14,27,.56); border:1px solid var(--border); border-radius:18px; margin-bottom:12px; }
  .admin-search input { margin:0; }
  .admin-search .btn { width:auto; margin:0; white-space:nowrap; padding:12px 16px; }
  .result-summary { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:14px; margin:0 2px 12px; }
  .submission-list { display:grid; gap:10px; }
  .submission-row { display:flex; align-items:stretch; gap:10px; }
  .submission-link { flex:1; min-width:0; text-decoration:none; display:flex; justify-content:space-between; gap:18px; align-items:center; padding:17px 18px; border:1px solid var(--border); border-radius:16px; background:rgba(10,19,35,.78); transition:.15s ease; }
  .submission-link:hover { border-color:var(--border-strong); background:rgba(14,25,44,.92); transform:translateY(-1px); }
  .submission-name { font-weight:700; color:var(--gold-bright); overflow-wrap:anywhere; }
  .submission-meta { color:var(--muted); font-size:14px; margin-top:3px; overflow-wrap:anywhere; }
  .submission-action { width:auto !important; min-width:112px; margin:0 !important; align-self:stretch; padding:10px 14px !important; }
  .admin-success { display:none; margin:0 0 16px; padding:12px 14px; border-radius:12px; color:#d7f7df; background:rgba(34,115,65,.23); border:1px solid rgba(115,214,142,.28); }
  @media (max-width:760px) {
    .admin-header { display:block; }
    .admin-tools { justify-content:flex-start; margin-top:14px; }
    .stats-grid { grid-template-columns:repeat(2,1fr); }
    .submission-row { gap:7px; }
    .submission-link { padding:14px; gap:10px; align-items:flex-start; flex-direction:column; }
    .submission-action { min-width:96px; }
  }
</style>
</head>
<body>
<div class="page wide admin-page">
  <div class="admin-header">
    <div>
      <p class="eyebrow">Stroll to the Stable · Admin</p>
      <h1 id="pageTitle">Nativity Submissions</h1>
      <p id="pageDescription">Search and manage nativity submissions.</p>
    </div>
    <div class="admin-tools">
      <a class="btn btn-outline" href="/admin-dashboard.html">← Admin Home</a>
      <a class="btn btn-outline" href="/admin-schedule.html">Scheduling</a>
    </div>
  </div>

  <div class="error-banner" data-error-banner></div>
  <div class="admin-success" id="successBanner"></div>

  <div class="stats-grid" aria-label="Submission filters">
    <button class="stat-card" data-status=""><span class="stat-number" id="countAll">—</span><span class="stat-label">All</span></button>
    <button class="stat-card" data-status="pending"><span class="stat-number" id="countPending">—</span><span class="stat-label">Pending</span></button>
    <button class="stat-card" data-status="submitted"><span class="stat-number" id="countSubmitted">—</span><span class="stat-label">Checked In</span></button>
    <button class="stat-card" data-status="returned"><span class="stat-number" id="countReturned">—</span><span class="stat-label">Returned</span></button>
  </div>

  <div class="admin-search">
    <input type="text" id="search" aria-label="Search submissions" placeholder="Search name, phone, email, submission number, or piece description…">
    <button class="btn btn-outline" id="clearSearchBtn">Clear</button>
  </div>

  <div class="result-summary">
    <span id="resultCount">Loading…</span>
    <span id="activeFilter"></span>
  </div>

  <div id="list" class="submission-list"></div>
</div>
<script src="/js/app.js"></script>
<script>
const initialStatus = new URLSearchParams(window.location.search).get('status') || '';
let currentStatus = ['pending','submitted','returned'].includes(initialStatus) ? initialStatus : '';
let knownNativities = new Map();

function esc(value) {
  return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
}
function showSuccess(message) {
  const el=document.getElementById('successBanner'); el.textContent=message; el.style.display='block'; setTimeout(()=>{el.style.display='none';},3500);
}
function statusLabel(status) { return status==='submitted'?'checked in':(status||'all'); }
function setPageHeading() {
  const title=document.getElementById('pageTitle'), desc=document.getElementById('pageDescription');
  if(currentStatus==='pending'){title.textContent='Check In Nativities';desc.textContent='Pending submissions ready to be reviewed and checked in.';}
  else if(currentStatus==='submitted'){title.textContent='Return Nativities';desc.textContent='Checked-in nativities ready to be returned to their owners.';}
  else if(currentStatus==='returned'){title.textContent='Returned Nativities';desc.textContent='Nativities that have already been returned.';}
  else {title.textContent='All Nativity Submissions';desc.textContent='Search and manage every nativity submission.';}
}
function syncFilterButtons(){document.querySelectorAll('[data-status]').forEach(btn=>btn.classList.toggle('active',btn.dataset.status===currentStatus));}
async function load() {
  hideError(); setPageHeading(); syncFilterButtons();
  const search=document.getElementById('search').value.trim();
  const qs=new URLSearchParams();
  if(search)qs.set('search',search);
  if(currentStatus)qs.set('status',currentStatus);
  try{
    const {nativities,counts}=await api('/api/admin/nativities?'+qs.toString());
    knownNativities=new Map(nativities.map(n=>[String(n.id),n]));
    document.getElementById('countAll').textContent=counts.total;
    document.getElementById('countPending').textContent=counts.pending;
    document.getElementById('countSubmitted').textContent=counts.submitted;
    document.getElementById('countReturned').textContent=counts.returned;
    document.getElementById('resultCount').textContent=nativities.length===1?'1 result':`${nativities.length} results`;
    const bits=[]; if(currentStatus)bits.push(statusLabel(currentStatus)); if(search)bits.push(`matching “${search}”`);
    document.getElementById('activeFilter').textContent=bits.length?`Showing ${bits.join(' · ')}`:'Showing all submissions';
    const list=document.getElementById('list');
    if(!nativities.length){list.innerHTML='<div class="empty-state">No submissions match this view.</div>';return;}
    list.innerHTML=nativities.map(n=>`
      <div class="submission-row">
        <a class="submission-link" href="/admin-detail.html?id=${n.id}&from=${encodeURIComponent(currentStatus)}">
          <div>
            <div class="submission-name">${esc(n.owner_name)} <span style="color:var(--muted);font-weight:500">· ${esc(n.submission_number)}</span></div>
            <div class="submission-meta">${esc(n.owner_phone)} · ${esc(n.owner_email)} · ${esc(n.event_year)}</div>
          </div>
          <span class="status-pill status-${n.status}">${statusLabel(n.status)}</span>
        </a>
        ${currentStatus === 'submitted'
          ? `<button class="btn btn-secondary submission-action" data-return-id="${n.id}">Mark Returned</button>`
          : `<button class="btn btn-danger submission-action" data-delete-id="${n.id}">Delete</button>`}

      </div>`).join('');
  }catch(err){showError(err.message);}
}
document.getElementById('search').addEventListener('input',debounce(load,300));
document.getElementById('clearSearchBtn').addEventListener('click',()=>{document.getElementById('search').value='';load();});
document.querySelectorAll('[data-status]').forEach(btn=>btn.addEventListener('click',()=>{
  currentStatus=btn.dataset.status;
  const url=new URL(window.location.href);
  if(currentStatus)url.searchParams.set('status',currentStatus); else url.searchParams.delete('status');
  history.replaceState(null,'',url);
  load();
}));
document.getElementById('list').addEventListener('click',async e=>{
  const returnBtn=e.target.closest('[data-return-id]');
  if(returnBtn){
    const nativity=knownNativities.get(returnBtn.dataset.returnId);
    if(!nativity)return;
    hideError();
    returnBtn.disabled=true;
    returnBtn.textContent='Marking…';
    try{
      await api(`/api/admin/nativities/${nativity.id}/returned`,{method:'POST'});
      showSuccess(`${nativity.submission_number} marked returned.`);
      await load();
    }catch(err){
      showError(err.message);
      returnBtn.disabled=false;
      returnBtn.textContent='Mark Returned';
    }
    return;
  }

  const btn=e.target.closest('[data-delete-id]'); if(!btn)return;
  const nativity=knownNativities.get(btn.dataset.deleteId); if(!nativity)return;
  if(!window.confirm(`Permanently delete ${nativity.submission_number} from ${nativity.owner_name}?\n\nThis removes the submission, its piece records, and its stored photos. This cannot be undone.`))return;
  hideError(); btn.disabled=true; btn.textContent='Deleting…';
  try{await api(`/api/admin/nativities/${nativity.id}`,{method:'DELETE'});showSuccess(`${nativity.submission_number} was deleted.`);await load();}
  catch(err){showError(err.message);btn.disabled=false;btn.textContent='Delete';}
});
function debounce(fn,ms){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms);};}
load();
</script>
</body>
</html>

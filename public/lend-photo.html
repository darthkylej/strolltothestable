<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lend a Nativity — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <p class="eyebrow">Lend a Nativity · Step 1 of 3</p>
  <h1>Photo &amp; Story</h1>

  <div class="error-banner" data-error-banner></div>
  <div class="empty-state" id="closedState" style="display:none">Nativity submissions are currently closed.</div>

  <form id="photoForm" style="display:none">
    <div class="field">
      <label for="photo">Photo of the nativity</label>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <button type="button" class="btn" id="takePhotoBtn">Take Photo</button>
        <button type="button" class="btn" id="choosePhotoBtn">Upload Existing Photo</button>
      </div>
      <input type="file" id="photo" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="existingPhoto" accept="image/*" style="display:none">
      <img id="preview" class="photo-preview">
    </div>
    <div class="field">
      <label for="story">The story behind it (optional)</label>
      <textarea id="story" placeholder="Where did it come from? Why is it special to your family?"></textarea>
    </div>

    <button type="submit" class="btn btn-primary" id="submitBtn">Next: List the Pieces</button>
  </form>

  <p style="text-align:center; margin-top:10px"><a class="link" href="/dashboard.html">Cancel</a></p>
</div>
<script src="/js/app.js"></script>
<script>
async function initialize() {
  try {
    const { submissionsOpen } = await api('/api/settings');
    document.getElementById('photoForm').style.display = submissionsOpen ? 'block' : 'none';
    document.getElementById('closedState').style.display = submissionsOpen ? 'none' : 'block';
  } catch (err) {
    showError(err.message);
  }
}

document.getElementById('takePhotoBtn').addEventListener('click', () => document.getElementById('photo').click());
document.getElementById('choosePhotoBtn').addEventListener('click', () => document.getElementById('existingPhoto').click());

function handlePhotoSelection(e) {
  const file = e.target.files[0];
  if (!file) return;
  const other = document.getElementById(e.target.id === 'photo' ? 'existingPhoto' : 'photo');
  other.value = '';
  const preview = document.getElementById('preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
}
document.getElementById('photo').addEventListener('change', handlePhotoSelection);
document.getElementById('existingPhoto').addEventListener('change', handlePhotoSelection);

document.getElementById('photoForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  const btn = document.getElementById('submitBtn');
  const file = document.getElementById('photo').files[0] || document.getElementById('existingPhoto').files[0];
  if (!file) { showError('Please add a photo.'); return; }
  btn.disabled = true;
  btn.textContent = 'Uploading photo…';
  try {
    const photoKey = await uploadPhoto(file);
    const { id } = await api('/api/nativities', {
      method: 'POST',
      body: {
        photoKey,
        story: document.getElementById('story').value,
        includeInTour: true,
      },
    });
    window.location.href = `/lend-pieces.html?id=${id}`;
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = 'Next: List the Pieces';
  }
});

initialize();
</script>
</body>
</html>

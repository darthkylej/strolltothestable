<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk-In Desk — Stroll to the Stable Admin</title>
<link rel="stylesheet" href="/style.css">
<style>
  .desk { max-width:640px; }
  .desk-top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
  .desk-top h1 { margin:0; font-size:1.7rem; }
  .desk-top .btn { width:auto; margin:0; padding:9px 14px; }
  .card { padding:18px; }
  .card h2 { margin:0 0 12px; font-size:1.15rem; }
  .row { display:flex; gap:10px; align-items:center; }
  .row > * { flex:1; }
  .code-chip { display:inline-block; padding:4px 11px; border-radius:999px; background:var(--gold); color:#10172a; font-weight:900; white-space:nowrap; }
  .list { display:grid; gap:8px; }
  .item { display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--border); border-radius:14px; background:rgba(8,16,31,.6); text-decoration:none; color:var(--text); }
  a.item:hover, button.item:hover { border-color:var(--border-strong); }
  button.item { width:100%; margin:0; text-align:left; font:inherit; cursor:pointer; }
  .item .main { flex:1; min-width:0; }
  .item .t { font-weight:700; color:var(--gold-bright); overflow-wrap:anywhere; }
  .item .s { color:var(--muted); font-size:14px; overflow-wrap:anywhere; }
  .thumb { width:48px; height:48px; border-radius:9px; object-fit:cover; border:1px solid var(--border); flex-shrink:0; background:#0b1528; }
  .ok-dot { width:26px; height:26px; border-radius:50%; background:#2f9e5b; color:#fff; display:grid; place-items:center; font-weight:900; flex-shrink:0; }
  .todo { color:#10172a; background:var(--gold); border-radius:999px; padding:5px 12px; font-weight:800; font-size:14px; white-space:nowrap; }
  .photo-pick { display:flex; align-items:center; justify-content:center; gap:10px; min-height:120px; border:2px dashed var(--border-strong); border-radius:16px; cursor:pointer; color:var(--gold-bright); font-weight:700; margin-bottom:14px; overflow:hidden; position:relative; }
  .photo-pick img { width:100%; max-height:240px; object-fit:cover; display:block; }
  .photo-pick input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .stepper { display:flex; align-items:center; gap:8px; }
  .stepper button { width:46px; height:46px; margin:0; padding:0; font-size:1.4rem; border-radius:12px; }
  .stepper input { width:70px; text-align:center; margin:0; font-size:1.15rem; }
  .big { font-size:1.1rem; padding:15px; }
  .hidden { display:none !important; }
  .muted-line { color:var(--muted); font-size:14px; margin:6px 0 0; }

  /* Waiver sheet */
  .sheet { position:fixed; inset:0; z-index:50; background:rgba(3,7,15,.86); display:flex; align-items:flex-end; justify-content:center; }
  .sheet-body { width:100%; max-width:640px; max-height:96vh; overflow:auto; background:var(--navy-soft); border:1px solid var(--border-strong); border-radius:22px 22px 0 0; padding:18px; }
  .sheet-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .sheet-head h2 { margin:0; font-size:1.2rem; }
  .x { width:40px; height:40px; margin:0; padding:0; border-radius:50%; font-size:1.3rem; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .seg button { margin:0; }
  .seg button.on { background:var(--gold); color:#10172a; border-color:var(--gold); }
  .agreement { max-height:34vh; overflow:auto; padding:12px 14px; border-radius:12px; background:#fffdf7; color:#1f2733; font-size:14px; line-height:1.5; margin-bottom:12px; }
  .agreement h3 { font-size:15px; margin:12px 0 4px; color:#1f2733; }
  .agreement p { color:#1f2733; margin:0 0 8px; }
  .agreement h3:first-child { margin-top:0; }
  .mini { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--border); border-radius:12px; background:rgba(8,16,31,.6); }
  .mini .thumb { width:40px; height:40px; }
  .mini .need { position:relative; overflow:hidden; color:#10172a; background:var(--gold); border-radius:999px; padding:4px 10px; font-weight:800; font-size:13px; white-space:nowrap; cursor:pointer; }
  .mini .need input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .done-flash.added { background:rgba(16,92,52,.9); }
  .group-label { color:var(--muted); font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; margin:4px 0 -2px; }
  .agreement .release-box { border:2px solid #9a7b2f; border-radius:8px; padding:8px 10px; margin:10px 0; }
  .check { display:flex; gap:10px; align-items:flex-start; margin:0 0 10px; font-size:15px; line-height:1.4; }
  .check input { width:22px; height:22px; margin:2px 0 0; flex-shrink:0; }
  .sig { width:100%; height:170px; background:#fff; border-radius:12px; touch-action:none; display:block; }
  .sig-row { display:flex; justify-content:space-between; align-items:center; margin:6px 0 12px; color:var(--muted); font-size:14px; }
  .linkbtn { background:none; border:0; color:var(--gold-bright); text-decoration:underline; padding:4px; margin:0; width:auto; font:inherit; cursor:pointer; }

  /* Success */
  .done-flash { position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(16,92,52,.96); color:#fff; text-align:center; padding:24px; cursor:pointer; }
  .done-flash .ring { width:120px; height:120px; border-radius:50%; background:#fff; color:#1d7a46; display:grid; place-items:center; font-size:72px; font-weight:900; animation:pop .35s ease-out; }
  .done-flash .big-t { font-size:2rem; font-weight:900; }
  .done-flash .sub { font-size:1.25rem; opacity:.95; }
  @keyframes pop { from { transform:scale(.4); opacity:0; } to { transform:scale(1); opacity:1; } }
</style>
</head>
<body>
<div class="page desk">
  <div class="desk-top">
    <h1>Walk-In Desk</h1>
    <a class="btn btn-outline" id="topBtn" href="/admin-dashboard.html">← Admin</a>
  </div>
  <div class="error-banner" data-error-banner></div>

  <!-- Find or create the donor -->
  <div id="findView" class="hidden">
    <div class="card">
      <input type="text" inputmode="search" enterkeyhint="search" id="donorSearch" aria-label="Find a donor" placeholder="Search donor code, name, or phone" autocomplete="off">
      <div class="list" id="donorResults" style="margin-top:10px"></div>
    </div>
    <form class="card" id="newDonorForm" style="margin-top:14px" autocomplete="off">
      <h2>New donor</h2>
      <input id="newName" type="text" maxlength="100" placeholder="Name" aria-label="Name" required>
      <input id="newPhone" type="tel" maxlength="40" placeholder="Phone (optional)" aria-label="Phone (optional)">
      <input id="newEmail" type="email" maxlength="254" placeholder="Email (optional)" aria-label="Email (optional)">
      <div class="muted-line hidden" id="newEmailHint" style="margin:-4px 0 10px;color:var(--gold-bright)">No email: they won't be able to log in later, sign online, or get a receipt.</div>
      <div class="list" id="possibleMatches" style="margin-bottom:12px"></div>
      <button class="btn btn-primary big" id="createDonorBtn" type="submit" style="margin:0">Start</button>
    </form>
  </div>

  <!-- Donor: add nativities -->
  <div id="donorView" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div style="flex:1;min-width:0">
          <div style="font-size:1.3rem;font-weight:800;color:var(--gold-bright);overflow-wrap:anywhere" id="donorName"></div>
          <div class="muted-line" id="donorContact" style="margin:2px 0 0"></div>
          <div class="muted-line hidden" id="noEmailNote" style="margin:4px 0 0;color:var(--gold-bright)">No email on file: they can't log in, sign online, or get a receipt. Tap Edit to add one.</div>
        </div>
        <span class="code-chip" id="donorCode" style="flex:0 0 auto"></span>
      </div>
      <button type="button" class="linkbtn" id="editToggle" style="margin-top:6px">Edit</button>
      <form id="editDonorForm" class="hidden" style="margin-top:10px" autocomplete="off">
        <input id="editName" type="text" maxlength="100" placeholder="Name" aria-label="Name" required>
        <input id="editPhone" type="tel" maxlength="40" placeholder="Phone (optional)" aria-label="Phone (optional)">
        <input id="editEmail" type="email" maxlength="254" placeholder="Email (optional)" aria-label="Email (optional)">
        <button class="btn btn-secondary" id="saveDonorBtn" type="submit" style="margin:0">Save</button>
      </form>
    </div>

    <form class="card" id="addForm" style="margin-top:14px" autocomplete="off">
      <h2>Add nativity</h2>
      <label class="photo-pick" id="photoPick">
        <span id="photoPrompt">📷 Take or choose photo</span>
        <img id="photoPreview" class="hidden" alt="Nativity photo">
        <input id="addPhoto" type="file" accept="image/*" aria-label="Nativity photo">
      </label>
      <input id="addDescription" type="text" maxlength="300" placeholder="Short description" aria-label="Short description" required>
      <div class="row" style="margin-bottom:12px">
        <span style="flex:0 0 auto;color:var(--wood);font-weight:700">Pieces</span>
        <div class="stepper" style="flex:0 0 auto">
          <button type="button" class="btn btn-outline" id="minus" aria-label="Fewer pieces">−</button>
          <input id="addCount" type="number" inputmode="numeric" min="1" max="100" value="1" aria-label="Number of pieces">
          <button type="button" class="btn btn-outline" id="plus" aria-label="More pieces">+</button>
        </div>
      </div>
      <input id="addCondition" type="text" maxlength="2000" placeholder="Condition notes (optional)" aria-label="Condition notes (optional)">
      <button class="btn btn-primary big" id="addBtn" type="submit" style="margin:0">Add Nativity</button>
    </form>

    <div class="card" id="listCard" style="margin-top:14px">
      <div class="list" id="natList"></div>
      <button type="button" class="btn btn-primary big hidden" id="batchBtn" style="margin:14px 0 0"></button>
    </div>

    <button type="button" class="btn btn-secondary big" id="finishBtn" style="margin-top:14px">Done with this donor</button>
  </div>
</div>

<!-- Waiver + check-in sheet -->
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-body">
    <div class="sheet-head">
      <h2 id="sheetTitle">Waiver</h2>
      <button type="button" class="btn btn-outline x" id="sheetClose" aria-label="Close">×</button>
    </div>

    <div class="list" id="batchList" style="margin-bottom:14px"></div>

    <div id="alreadySigned" class="hidden">
      <p style="margin:0 0 14px;color:var(--pasture);font-weight:700">✓ Waiver already signed</p>
      <button type="button" class="btn btn-primary big" id="checkInOnlyBtn" style="margin:0">Check In</button>
    </div>

    <div id="chooseWaiver">
      <div class="seg">
        <button type="button" class="btn btn-outline on" id="segDevice">Sign here</button>
        <button type="button" class="btn btn-outline" id="segPaper">Paper</button>
      </div>

      <div id="devicePane">
        <div class="agreement" id="agreementText">Loading…</div>
        <label class="check"><input type="checkbox" id="ackRelease"><span id="ackReleaseText"></span></label>
        <label class="check"><input type="checkbox" id="ackConsent"><span id="ackConsentText"></span></label>
        <canvas class="sig" id="sigPad" aria-label="Signature box"></canvas>
        <div class="sig-row"><span id="signerLine"></span><button type="button" class="linkbtn" id="sigClear">Clear</button></div>
        <button type="button" class="btn btn-primary big" id="signBtn" style="margin:0">Sign &amp; Check In</button>
      </div>

      <div id="paperPane" class="hidden">
        <button type="button" class="btn btn-outline" id="printBtn" style="margin:0 0 12px">Print waiver</button>
        <button type="button" class="btn btn-primary big" id="paperBtn" style="margin:0">Paper Signed: Check In</button>
      </div>
    </div>
  </div>
</div>

<div class="done-flash hidden" id="doneFlash" role="status" aria-live="assertive">
  <div class="ring">✓</div>
  <div class="big-t" id="doneTitle">Checked in</div>
  <div class="sub" id="doneSub"></div>
</div>

<script src="/js/app.js"></script>
<script>
const donorId = new URLSearchParams(location.search).get('donor');
let donor = null, nativities = [], eventYear = new Date().getFullYear();
let agreement = null, current = null, mode = 'device';
const checkedThisVisit = [];

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' })[c]);
const show = (el, on) => el.classList.toggle('hidden', !on);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const pcs = (n) => `${n} pc${Number(n) === 1 ? '' : 's'}`;

/* ── Find or create ─────────────────────────────────────────── */
function donorItem(d) {
  const sub = [d.phone, d.email].filter(Boolean).map(esc).join(' · ');
  return `<a class="item" href="/admin-walkin.html?donor=${encodeURIComponent(d.id)}">
    <div class="main"><div class="t">${esc(d.name)}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>
    ${d.donorCode ? `<span class="code-chip">${esc(d.donorCode)}</span>` : ''}</a>`;
}
async function findDonors(term, target) {
  if (!term) { target.innerHTML = ''; return []; }
  const { donors } = await api('/api/admin/donors?search=' + encodeURIComponent(term));
  target.innerHTML = donors.map(donorItem).join('');
  return donors;
}
function initFind() {
  show($('findView'), true);
  $('donorSearch').addEventListener('input', debounce(() => { hideError(); findDonors($('donorSearch').value.trim(), $('donorResults')).catch((e) => showError(e.message)); }, 250));
  $('newName').addEventListener('input', debounce(() => {
    const t = $('newName').value.trim();
    if (t.length < 3) { $('possibleMatches').innerHTML = ''; return; }
    findDonors(t, $('possibleMatches')).catch(() => {});
  }, 350));
  const syncEmailHint = () => show($('newEmailHint'), !$('newEmail').value.trim() && !!$('newName').value.trim());
  $('newEmail').addEventListener('input', syncEmailHint);
  $('newName').addEventListener('input', syncEmailHint);
  const dupLine = (d) => `${d.name}${d.donorCode ? ` (${d.donorCode})` : ''}${[d.phone, d.email].filter(Boolean).length ? ' - ' + [d.phone, d.email].filter(Boolean).join(' · ') : ''}`;
  async function createDonor(allowDuplicate) {
    const res = await fetch('/api/admin/donors', { method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ name:$('newName').value, phone:$('newPhone').value, email:$('newEmail').value, allowDuplicate }) });
    const data = await res.json().catch(() => ({}));
    if (res.status === 409 && data.existing) {
      if (confirm(`${data.error}\n\nOpen that donor?`)) { location.href = '/admin-walkin.html?donor=' + encodeURIComponent(data.existing.id); return true; }
      return false;
    }
    if (res.status === 409 && data.duplicates?.length) {
      const first = data.duplicates[0];
      if (confirm(`${data.error}\n\n${data.duplicates.map(dupLine).join('\n')}\n\nOK = open ${first.name}'s account.\nCancel = this is someone new.`)) {
        location.href = '/admin-walkin.html?donor=' + encodeURIComponent(first.id); return true;
      }
      if (!confirm('Create a new account anyway?')) return false;
      return createDonor(true);
    }
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    location.href = '/admin-walkin.html?donor=' + encodeURIComponent(data.donor.id);
    return true;
  }
  $('newDonorForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideError();
    const btn = $('createDonorBtn'); btn.disabled = true;
    try {
      if (!(await createDonor(false))) btn.disabled = false;
    } catch (err) { showError(err.message); btn.disabled = false; }
  });
  $('donorSearch').focus();
}

/* ── Donor view ─────────────────────────────────────────────── */
function render() {
  $('donorName').textContent = donor.name;
  $('donorContact').textContent = [donor.phone, donor.email].filter(Boolean).join(' · ') || 'No phone or email';
  $('donorCode').textContent = donor.donorCode || '';
  show($('noEmailNote'), !donor.email);
  show($('donorCode'), !!donor.donorCode);
  $('editName').value = donor.name || ''; $('editPhone').value = donor.phone || ''; $('editEmail').value = donor.email || '';
  document.title = `${donor.name} — Walk-In Desk`;

  const mine = nativities.filter((n) => Number(n.event_year) === Number(eventYear));
  const todo = mine.filter((n) => n.status === 'pending');
  const done = mine.filter((n) => n.status !== 'pending');
  show($('listCard'), mine.length > 0);
  const thumb = (n) => n.photo_key ? `<img class="thumb" src="/photos/${esc(n.photo_key)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'thumb'}))">` : '<span class="thumb"></span>';
  $('natList').innerHTML = [
    todo.length ? `<div class="group-label">Waiting for waiver · ${todo.length}</div>` : '',
    ...todo.map((n) => `<a class="item" href="/admin-detail.html?id=${encodeURIComponent(n.id)}">
        ${thumb(n)}
        <div class="main"><div class="t">${esc(n.submission_number)}</div><div class="s">${esc(n.description || '')} · ${pcs(n.piece_count)}</div></div>
        ${n.photo_key ? '' : '<span class="todo">No photo</span>'}</a>`),
    done.length ? `<div class="group-label">Checked in · ${done.length}</div>` : '',
    ...done.map((n) => `<a class="item" href="/admin-detail.html?id=${encodeURIComponent(n.id)}">
        ${thumb(n)}
        <div class="main"><div class="t">${esc(n.submission_number)}</div><div class="s">${esc(n.description || '')} · ${pcs(n.piece_count)}</div></div>
        <span class="ok-dot">✓</span></a>`),
  ].join('');
  const batchBtn = $('batchBtn');
  batchBtn.textContent = todo.length === 1 ? 'Waiver & Check In' : `Waiver & Check In All ${todo.length}`;
  show(batchBtn, todo.length > 0);
}
async function load() {
  const data = await api('/api/admin/donors/' + encodeURIComponent(donorId));
  donor = data.donor; nativities = data.nativities; eventYear = data.eventYear;
  render();
}

function resetAddForm() {
  $('addForm').reset(); $('addCount').value = '1';
  show($('photoPreview'), false); show($('photoPrompt'), true);
}
function initDonor() {
  show($('donorView'), true);
  $('topBtn').href = '/admin-walkin.html'; $('topBtn').textContent = '← Donors';
  $('minus').addEventListener('click', () => { $('addCount').value = Math.max(1, (parseInt($('addCount').value, 10) || 1) - 1); });
  $('plus').addEventListener('click', () => { $('addCount').value = Math.min(100, (parseInt($('addCount').value, 10) || 0) + 1); });
  $('addPhoto').addEventListener('change', () => {
    const f = $('addPhoto').files[0];
    if (!f) return;
    $('photoPreview').src = URL.createObjectURL(f);
    show($('photoPreview'), true); show($('photoPrompt'), false);
  });
  $('editToggle').addEventListener('click', () => show($('editDonorForm'), $('editDonorForm').classList.contains('hidden')));

  $('addForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideError();
    const photo = $('addPhoto').files[0];
    if (!photo) { showError('Take a photo of the nativity first.'); return; }
    const btn = $('addBtn'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const created = await api(`/api/admin/donors/${encodeURIComponent(donorId)}/nativities`, { method:'POST',
        body: { description:$('addDescription').value, pieceCount:Number($('addCount').value), conditionNote:$('addCondition').value } });
      let photoOk = true;
      try { await uploadPhotoTo(photo, `/api/admin/nativities/${created.id}/main-photo`); } catch (_) { photoOk = false; }
      resetAddForm();
      await load();
      flash('Added', created.submissionNumber + (photoOk ? '' : ' · photo did not upload'), true);
    } catch (err) { showError(err.message); }
    finally { btn.disabled = false; btn.textContent = 'Add Nativity'; }
  });

  $('editDonorForm').addEventListener('submit', async (e) => {
    e.preventDefault(); hideError();
    try {
      await api('/api/admin/donors/' + encodeURIComponent(donorId), { method:'PATCH',
        body: { name:$('editName').value, phone:$('editPhone').value, email:$('editEmail').value, address:donor.address || '', cityStateZip:donor.cityStateZip || '' } });
      show($('editDonorForm'), false); await load();
    } catch (err) { showError(err.message); }
  });

  $('batchBtn').addEventListener('click', openSheet);
  $('finishBtn').addEventListener('click', async () => {
    const btn = $('finishBtn'); btn.disabled = true;
    let note = '';
    if (checkedThisVisit.length) {
      try {
        const r = await api(`/api/admin/donors/${encodeURIComponent(donorId)}/checkin-summary`, { method:'POST', body:{ ids: checkedThisVisit } });
        note = r.emailSent ? 'Receipt emailed.' : r.hasEmail ? 'Receipt email could not be sent.' : '';
      } catch (_) { note = 'Receipt email could not be sent.'; }
    }
    if (note) alert(note);
    location.href = '/admin-walkin.html';
  });

  load().catch((err) => showError(err.message));
}

/* ── Waiver sheet ───────────────────────────────────────────── */
const canvas = $('sigPad'), ctx = canvas.getContext('2d');
let hasSig = false, drawing = false, lastPt = null, lastMid = null;
function sizeCanvas() {
  const r = canvas.getBoundingClientRect(); if (!r.width) return;
  canvas.width = Math.round(r.width * devicePixelRatio); canvas.height = Math.round(r.height * devicePixelRatio);
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
  ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  hasSig = false;
}
const pt = (e) => { const r = canvas.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
function drawTo(p) { const m = { x:(lastPt.x + p.x) / 2, y:(lastPt.y + p.y) / 2 }; ctx.beginPath(); ctx.moveTo(lastMid.x, lastMid.y); ctx.quadraticCurveTo(lastPt.x, lastPt.y, m.x, m.y); ctx.stroke(); lastMid = m; lastPt = p; }
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); canvas.setPointerCapture(e.pointerId); drawing = true; hasSig = true; const p = pt(e); lastPt = p; lastMid = p; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + .1, p.y + .1); ctx.stroke(); });
canvas.addEventListener('pointermove', (e) => { if (!drawing) return; e.preventDefault(); const s = (e.getCoalescedEvents && e.getCoalescedEvents()) || []; for (const ev of (s.length ? s : [e])) drawTo(pt(ev)); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) canvas.addEventListener(ev, () => { drawing = false; lastPt = lastMid = null; });
$('sigClear').addEventListener('click', sizeCanvas);

function setMode(m) {
  mode = m;
  $('segDevice').classList.toggle('on', m === 'device'); $('segPaper').classList.toggle('on', m === 'paper');
  show($('devicePane'), m === 'device'); show($('paperPane'), m === 'paper');
  if (m === 'device') requestAnimationFrame(sizeCanvas);
}
$('segDevice').addEventListener('click', () => setMode('device'));
$('segPaper').addEventListener('click', () => setMode('paper'));

async function loadAgreement(id) {
  if (agreement) return;
  const data = await api(`/api/admin/nativities/${id}/waiver-record`);
  agreement = data.agreement;
  $('agreementText').innerHTML = agreement.sections.map((s) => s.release
    ? `<div class="release-box"><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`
    : `<h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>`).join('');
  $('ackReleaseText').textContent = agreement.releaseAck;
  $('ackConsentText').textContent = agreement.consentText;
}

function batchItems() { return nativities.filter((n) => Number(n.event_year) === Number(eventYear) && n.status === 'pending'); }
function renderBatchList() {
  $('batchList').innerHTML = current.map((n) => `<div class="mini">
      ${n.photo_key ? `<img class="thumb" src="/photos/${esc(n.photo_key)}" alt="">` : '<span class="thumb"></span>'}
      <div class="main" style="flex:1;min-width:0"><div class="t" style="font-weight:700;color:var(--gold-bright)">${esc(n.submission_number)}</div>
      <div class="s" style="color:var(--muted);font-size:13px">${esc(n.description || '')} · ${pcs(n.piece_count)}</div></div>
      ${n.photo_key ? '' : `<label class="need">Add photo<input type="file" accept="image/*" data-photo="${esc(n.id)}"></label>`}
    </div>`).join('');
  $('batchList').querySelectorAll('[data-photo]').forEach((inp) => inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const r = await uploadPhotoTo(f, `/api/admin/nativities/${inp.dataset.photo}/main-photo`);
      const n = current.find((x) => String(x.id) === inp.dataset.photo); if (n) n.photo_key = r.key;
      renderBatchList();
    } catch (err) { alert(err.message); }
  }));
}
function openSheet() {
  current = batchItems();
  if (!current.length) return;
  hideError();
  const unsigned = current.filter((n) => !n.waiver_signed);
  $('sheetTitle').textContent = current.length === 1 ? `Waiver · ${current[0].submission_number}` : `Waiver · ${current.length} nativities`;
  renderBatchList();
  show($('alreadySigned'), unsigned.length === 0);
  show($('chooseWaiver'), unsigned.length > 0);
  $('ackRelease').checked = false; $('ackConsent').checked = false;
  $('signerLine').textContent = `Signer: ${donor.name}`;
  show($('sheet'), true);
  document.body.style.overflow = 'hidden';
  setMode('device');
  loadAgreement(current[0].id).catch((e) => { $('agreementText').textContent = 'Could not load the waiver text. ' + e.message; });
}
function closeSheet() { show($('sheet'), false); document.body.style.overflow = ''; current = null; }
$('sheetClose').addEventListener('click', closeSheet);


$('printBtn').addEventListener('click', () => {
  if (!current) return;
  // The printed copy lists exactly the nativities in this batch.
  window.open(`/api/admin/donors/${encodeURIComponent(donorId)}/batch-waiver-pdf?ids=${current.map((n) => n.id).join(',')}`, '_blank');
});

function flash(title, sub, quick) {
  $('doneTitle').textContent = title;
  $('doneSub').textContent = sub;
  $('doneFlash').classList.toggle('added', !!quick);
  show($('doneFlash'), true);
  if (navigator.vibrate) navigator.vibrate(quick ? 60 : 150);
  clearTimeout(flash.t);
  flash.t = setTimeout(() => show($('doneFlash'), false), quick ? 1300 : 2400);
}
$('doneFlash').addEventListener('click', () => show($('doneFlash'), false));

async function checkIn(body, btn) {
  if (!current) return;
  const missing = current.filter((n) => !n.photo_key);
  if (missing.length) { alert('Add a photo for ' + missing.map((n) => n.submission_number).join(', ') + ' first.'); return; }
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Checking in…';
  try {
    const r = await api(`/api/admin/donors/${encodeURIComponent(donorId)}/desk-checkin`, { method:'POST', body: { ...body, ids: current.map((n) => n.id) } });
    r.checkedIn.forEach((x) => checkedThisVisit.push(x.id));
    closeSheet();
    await load();
    const count = r.checkedIn.length;
    flash(count === 1 ? 'Checked in' : `${count} checked in`, (count === 1 ? r.checkedIn[0].submissionNumber : 'All nativities') + (donor.donorCode ? ' · ' + donor.donorCode : ''));
  } catch (err) { alert(err.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}
$('signBtn').addEventListener('click', () => {
  if (!$('ackRelease').checked || !$('ackConsent').checked) { alert('The donor needs to check both boxes.'); return; }
  if (!hasSig) { alert('Have the donor sign in the white box.'); return; }
  checkIn({ method:'device', releaseAccepted:true, electronicSignatureConsent:true, signatureImage: canvas.toDataURL('image/png') }, $('signBtn'));
});
$('paperBtn').addEventListener('click', () => {
  if (!confirm(`Confirm ${donor.name} signed the printed waiver covering ${current.length === 1 ? current[0].submission_number : 'all ' + current.length + ' nativities'}.`)) return;
  checkIn({ method:'paper' }, $('paperBtn'));
});
$('checkInOnlyBtn').addEventListener('click', () => checkIn({}, $('checkInOnlyBtn')));

if (donorId) initDonor(); else initFind();
</script>
</body>
</html>

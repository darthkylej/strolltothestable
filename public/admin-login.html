<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <p class="eyebrow">Stroll to the Stable</p>
  <h1>Admin Login</h1>

  <div class="error-banner" data-error-banner></div>

  <form id="emailForm">
    <div class="field">
      <label for="email">Admin email</label>
      <input type="email" id="email" required>
    </div>
    <button type="submit" class="btn btn-primary">Send Login Code</button>
  </form>

  <form id="codeForm" style="display:none">
    <p style="color:var(--wood)">Enter the 6-digit code we just emailed you.</p>
    <div class="field">
      <label for="code">Login code</label>
      <input type="text" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" required>
    </div>
    <button type="submit" class="btn btn-primary">Verify &amp; Log In</button>
  </form>

  <p style="text-align:center; margin-top:10px"><a class="link" href="/index.html">Back</a></p>
</div>
<script src="/js/app.js"></script>
<script>
let pendingEmail = '';

// If this browser still has a valid admin session, do not make the admin
// repeat the email-code login flow. A deliberate logout clears the session
// cookie, so logged-out admins will remain on this page as expected.
(async function redirectIfAlreadyAdmin() {
  try {
    const response = await fetch('/api/admin/admins', {
      method: 'GET',
      headers: { Accept: 'application/json' },
      credentials: 'same-origin',
    });
    if (response.ok) {
      window.location.replace('/admin-dashboard.html');
    }
  } catch (_) {
    // If the session check itself fails, leave the normal login form usable.
  }
})();

document.getElementById('emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  pendingEmail = document.getElementById('email').value;
  try {
    await api('/api/admin/request-otp', { method: 'POST', body: { email: pendingEmail } });
    document.getElementById('emailForm').style.display = 'none';
    document.getElementById('codeForm').style.display = 'block';
  } catch (err) {
    showError(err.message);
  }
});

document.getElementById('codeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  try {
    await api('/api/admin/verify-otp', {
      method: 'POST',
      body: { email: pendingEmail, code: document.getElementById('code').value },
    });
    window.location.href = '/admin-dashboard.html';
  } catch (err) {
    showError(err.message);
  }
});
</script>
</body>
</html>

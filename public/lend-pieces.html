<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lend a Nativity — Stroll to the Stable</title>
<link rel="stylesheet" href="/style.css">
<style>
  .piece-help { color:var(--wood); font-size:14px; margin:0 0 10px; line-height:1.45; }
  .piece-row { display:grid; grid-template-columns:30px 1fr 44px; gap:8px; align-items:start; padding:10px; margin:6px 0; border:1px solid var(--border); border-radius:12px; background:rgba(8,16,31,.5); }
  .piece-row .piece-number { margin:6px 0 0; }
  .piece-fields { display:grid; gap:6px; min-width:0; }
  .piece-fields input { margin:0; padding:10px 12px; font-size:16px; }
  .piece-side { display:grid; gap:6px; }
  .piece-icon { width:44px; height:42px; padding:0; margin:0; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,.04); color:var(--text); font-size:18px; cursor:pointer; }
  .piece-icon.has-photo { border-color:rgba(123,203,140,.5); background:rgba(123,203,140,.12); }
  .piece-icon.remove { font-size:20px; color:var(--muted); }
  .piece-tools { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 14px; }
  .piece-tools .btn { width:auto; margin:0; padding:10px 14px; }
  @media (min-width:640px) { .piece-fields { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">Lend a Nativity · Step 2 of 3</p>
  <h1>The Pieces</h1>

  <div class="error-banner" data-error-banner></div>

  <div id="countStep">
    <div class="field">
      <label for="pieceCount">How many pieces are in this nativity?</label>
      <input type="text" id="pieceCount" inputmode="numeric" pattern="[0-9]*" required>
    </div>
    <button class="btn btn-primary" id="generateBtn">Generate the Form</button>
  </div>

  <form id="piecesForm" style="display:none">
    <p class="piece-help">For each piece, describe it and note its condition (any chips, cracks or repairs). 📷 adds an optional photo.</p>
    <div id="pieceList"></div>
    <div class="piece-tools">
      <button type="button" class="btn btn-outline" id="addPieceBtn">+ Add a piece</button>
      <button type="button" class="btn btn-outline" id="noDamageBtn">Fill blank conditions with "No damage"</button>
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn">Save Nativity &amp; Continue to Waiver</button>
  </form>

  <p style="text-align:center; margin-top:10px"><a class="link" href="/dashboard.html">Cancel</a></p>
</div>
<script src="/js/app.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const nativityId = params.get('id');
const isReview = params.get('review') === '1';
let existingPieces = [];

function escAttr(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// One compact row per piece: description, condition, optional photo.
function pieceRowHtml(existing) {
  const key = existing?.photo_key || '';
  return `
    <div class="piece-row" data-photo-key="${escAttr(key)}">
      <span class="piece-number"></span>
      <div class="piece-fields">
        <input type="text" class="piece-desc" value="${escAttr(existing?.description)}" placeholder="Piece, e.g. Shepherd with lamb" required>
        <input type="text" class="piece-cond" value="${escAttr(existing?.condition_notes)}" placeholder="Condition, e.g. No damage" required>
      </div>
      <div class="piece-side">
        <button type="button" class="piece-icon photo${key ? ' has-photo' : ''}" title="Add a photo (optional)">📷</button>
        <button type="button" class="piece-icon remove" title="Remove this piece">×</button>
      </div>
      <input type="file" class="piece-file" accept="image/*" style="display:none">
    </div>`;
}

function renumber() {
  const rows = [...document.querySelectorAll('.piece-row')];
  rows.forEach((row, i) => {
    row.querySelector('.piece-number').textContent = i + 1;
    row.querySelector('.piece-desc').setAttribute('aria-label', `Piece ${i + 1} description`);
    row.querySelector('.piece-cond').setAttribute('aria-label', `Piece ${i + 1} condition`);
    row.querySelector('.remove').style.visibility = rows.length > 1 ? 'visible' : 'hidden';
  });
}

function renderPieces(count) {
  let html = '';
  for (let i = 0; i < count; i++) html += pieceRowHtml(existingPieces[i]);
  document.getElementById('pieceList').innerHTML = html;
  renumber();
  document.getElementById('countStep').style.display = 'none';
  document.getElementById('piecesForm').style.display = 'block';
}

document.getElementById('pieceList').addEventListener('click', (e) => {
  const row = e.target.closest('.piece-row'); if (!row) return;
  if (e.target.closest('.photo')) row.querySelector('.piece-file').click();
  if (e.target.closest('.remove') && document.querySelectorAll('.piece-row').length > 1) { row.remove(); renumber(); }
});
document.getElementById('pieceList').addEventListener('change', (e) => {
  if (!e.target.classList.contains('piece-file')) return;
  const row = e.target.closest('.piece-row');
  row.querySelector('.photo').classList.toggle('has-photo', !!e.target.files[0] || !!row.dataset.photoKey);
});
document.getElementById('addPieceBtn').addEventListener('click', () => {
  document.getElementById('pieceList').insertAdjacentHTML('beforeend', pieceRowHtml(null));
  renumber();
  const rows = document.querySelectorAll('.piece-row');
  rows[rows.length - 1].querySelector('.piece-desc').focus();
});
document.getElementById('noDamageBtn').addEventListener('click', () => {
  document.querySelectorAll('.piece-cond').forEach((input) => { if (!input.value.trim()) input.value = 'No damage'; });
});

document.getElementById('generateBtn').addEventListener('click', () => {
  hideError();
  const count = parseInt(document.getElementById('pieceCount').value, 10);
  if (!count || count < 1) { showError('Enter how many pieces this nativity has.'); return; }
  renderPieces(count);
});

async function init() {
  if (!isReview) return;
  try {
    const { nativity, pieces } = await api(`/api/nativities/${nativityId}`);
    if (nativity.status !== 'pending') { window.location.replace('/my-nativity.html?id=' + encodeURIComponent(nativityId)); return; }
    if (nativity.waiver_signed || nativity.waiver_method) {
      const warn = document.createElement('p');
      warn.className = 'piece-help';
      warn.style.cssText = 'padding:10px 12px;border:1px solid rgba(242,199,110,.4);border-radius:12px;background:rgba(242,199,110,.10)';
      warn.textContent = 'Saving changes to your pieces clears your waiver. You will review and sign a fresh one afterward.';
      document.getElementById('piecesForm').prepend(warn);
    }
    existingPieces = pieces;
    document.getElementById('pieceCount').value = pieces.length;
    renderPieces(pieces.length);
  } catch (err) {
    showError(err.message);
  }
}

document.getElementById('piecesForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  try {
    const pieces = [];
    for (const row of document.querySelectorAll('.piece-row')) {
      let photoKey = row.dataset.photoKey || null;
      const file = row.querySelector('.piece-file').files[0];
      if (file) photoKey = await uploadPhoto(file);
      pieces.push({ description: row.querySelector('.piece-desc').value, condition_notes: row.querySelector('.piece-cond').value, photoKey });
    }
    await api(`/api/nativities/${nativityId}/pieces`, { method: 'POST', body: { pieces } });
    window.location.href = '/waiver.html?id=' + encodeURIComponent(nativityId);
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = 'Save Nativity & Continue to Waiver';
  }
});

init();
</script>
</body>
</html>
